<svg xmlns="http://www.w3.org/2000/svg" width="880" height="170" viewBox="0 0 880 170" role="img" aria-label="Currently: CodeSentinel, DevTools Pack, PromptAtlas">
  <defs>
    <style>
      .mono{font-family:ui-monospace,SFMono-Regular,"JetBrains Mono",Consolas,monospace}
      .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
      .t{font-size:15px;font-weight:700;fill:#e2e8f0}
      .d{font-size:12.5px;fill:#94a3b8}
      .k{font-size:11px;fill:#64748b;letter-spacing:1.5px}
      .live{animation:pulse 2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
      .tag{font-size:11.5px;fill:#22d3ee}
      @media (prefers-reduced-motion: reduce){.live{animation:none}}
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="169" rx="14" fill="#0b1020" stroke="#334155" stroke-opacity="0.7"/>
  <circle cx="26" cy="27" r="5" fill="#4ade80" class="live"/>
  <text x="40" y="31" class="mono k">CURRENTLY BUILDING</text>

  <!-- card 1 -->
  <g transform="translate(20 48)">
    <rect width="270" height="104" rx="10" fill="#111827" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="16" y="28" class="sans t">🛡️ CodeSentinel</text>
    <text x="16" y="50" class="sans d">Self-hosted AI code review for</text>
    <text x="16" y="67" class="sans d">GitHub · GitLab · Gitea via Ollama</text>
    <text x="16" y="90" class="mono tag">FastAPI · SQLAlchemy · Docker</text>
  </g>
  <!-- card 2 -->
  <g transform="translate(305 48)">
    <rect width="270" height="104" rx="10" fill="#111827" stroke="#a78bfa" stroke-opacity="0.35"/>
    <text x="16" y="28" class="sans t">⚡ DevTools Pack</text>
    <text x="16" y="50" class="sans d">460+ agents, commands &amp; skills</text>
    <text x="16" y="67" class="sans d">for Claude Code and 12 more agents</text>
    <text x="16" y="90" class="mono tag">JavaScript · Shell · plugins</text>
  </g>
  <!-- card 3 -->
  <g transform="translate(590 48)">
    <rect width="270" height="104" rx="10" fill="#111827" stroke="#e879f9" stroke-opacity="0.35"/>
    <text x="16" y="28" class="sans t">📚 PromptAtlas</text>
    <text x="16" y="50" class="sans d">320+ bilingual EN/UK prompts,</text>
    <text x="16" y="67" class="sans d">just markdown in a git repo</text>
    <text x="16" y="90" class="mono tag">Markdown · JS · GitHub Actions</text>
  </g>
</svg>
